[package]
edition = "2021"
name = "unleash-yggdrasil"
version = "0.21.7"
description = "This is the Unleash SDK domain logic extracted into a library to facilitate building your own Unleash SDKs in anything, anywhere."
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["wall-clock"]
wall-clock = ["chrono/clock", "chrono/wasmbind"]
hostname = ["dep:hostname", "dep:wasm-bindgen"]
wasm-types = ["tsify", "dep:wasm-bindgen", "unleash-types/wasm-types"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hostname = { version = "0.4.1", optional = true }

[dependencies]
arc-swap = "1.9.2"
serde_json = "1.0.145"
murmur3 = "0.5.2"
ipnet = "2.11.0"
rand = "0.9.2"
pest = "2.8.3"
pest_derive = "2.8.3"
lazy_static = "1.5.0"
semver = "1.0.27"
convert_case = "0.11.0"
unleash-types = { version = "0.16.3", default-features = false }
chrono = { version = "0.4.42", default-features = false, features = ["serde", "std"] }
dashmap = "6.1.0"
ipnetwork = "0.21.0"
ahash = "0.8.12"
hashbrown = "0.17.1"
regex = "1.12.3"
tsify = { version = "0.5.8", optional = true, default-features = false, features = ["js"] }
wasm-bindgen = { version = "0.2", optional = true }

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dev-dependencies]
test-case = "3.3.1"
async-std = "1.13.2"
async-std-test = "0.0.4"
serial_test = "3.2.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8.2"
proptest = "1.8.0"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }

[[bench]]
name = "benchmark"
harness = false
